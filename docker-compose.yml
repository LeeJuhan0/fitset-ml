services:
  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    image: fitset-mlflow:latest
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://fitset-models/mlflow
      --host 0.0.0.0
      --port 5001
      --static-prefix /mlflow
      --allowed-hosts mlflow:5001,localhost:5001,127.0.0.1:5001,${EC2_ALLOWED_HOST:-localhost:5001}
      --cors-allowed-origins http://localhost:5001,${EC2_CORS_ORIGINS:-http://127.0.0.1:5001}
    ports:
      - "5001:5001"
    volumes:
      - /mlflow:/mlflow
    restart: always

  api:
    # 어드민 서비스 — 정적 대시보드·API·파일 목록(sqlite)·학습/라벨링 worker 포함
    build: .
    image: fitset-ml-admin-api:latest
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5001/mlflow
      MLFLOW_PROXY_TARGET: http://mlflow:5001            # /mlflow/* 역프록시의 중계 대상
      MLFLOW_UI_USER: ${MLFLOW_UI_USER:-}                # 프록시 Basic 인증 — 배포가 /app/.env로 주입
      MLFLOW_UI_PASSWORD: ${MLFLOW_UI_PASSWORD:-}        # 미설정이면 프록시 잠금(fail closed)
      RAW_DATA_BUCKET: fitset-dataset
      MODELS_BUCKET: fitset-models
      COLLECT_IMU_BUCKET: fitset-collect-imu
      COLLECT_VIDEO_BUCKET: fitset-collect-video
      COLLECT_LABELED_BUCKET: fitset-collect-labeled
      PHASE_MODELS_BUCKET: fitset-phase-models
      AWS_REGION: ap-northeast-2
      DATABASE_URL: sqlite+aiosqlite:////data/fitset_ml.db          # 파일 목록. 볼륨에 두어 컨테이너 교체에도 남는다
    volumes:
      - /mlflow/data:/data
    depends_on:
      - mlflow
    restart: always
