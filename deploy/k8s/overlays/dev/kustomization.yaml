apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fitset-ml
resources:
  - ../../base
  - externalsecret.yaml
  - ingress.yaml
patches:
  - path: patch-mlflow.yaml
  - path: patch-admin.yaml
# IMAGE_TAG 는 CD 가 커밋 SHA 로 치환한다(patch 의 버전 라벨도 같이). 두 이미지는 같은 커밋에서 빌드된다.
images:
  - name: fitset-mlflow
    newName: 729743892772.dkr.ecr.ap-northeast-2.amazonaws.com/fitset-mlflow
    newTag: IMAGE_TAG
  - name: fitset-ml-admin-api
    newName: 729743892772.dkr.ecr.ap-northeast-2.amazonaws.com/fitset-ml-admin-api
    newTag: IMAGE_TAG
