apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fitset-ml
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssm
    kind: SecretStore
  target:
    name: fitset-ml
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /fitset/dev/ml/database-url
    - secretKey: MLFLOW_BACKEND_URI
      remoteRef:
        key: /fitset/dev/ml/mlflow-backend-uri
    - secretKey: MLFLOW_UI_USER
      remoteRef:
        key: /fitset/dev/ml/mlflow-ui-user
    - secretKey: MLFLOW_UI_PASSWORD
      remoteRef:
        key: /fitset/dev/ml/mlflow-ui-password
