name: Restart Docker

# 인프라 재배포(rsync + build --no-cache + terraform)가 아니라,
# 현재 EC2의 /app·이미지 그대로 컨테이너만 다시 띄우는 수동 워크플로.
# 저장된 EC2_SSH_KEY로 SSH해서 docker compose up -d --force-recreate 만 실행한다.
on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "현재 /app 소스로 이미지 재빌드 후 재시작 (기본: 재시작만)"
        type: boolean
        default: false

jobs:
  restart:
    name: Restart containers
    runs-on: ubuntu-latest
    env:
      EC2_IP: ${{ vars.EC2_IP || '54.116.160.80' }}
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Docker compose up (재시작, 재배포 아님)
        run: |
          BUILD=""
          if [ "${{ inputs.rebuild }}" = "true" ]; then BUILD="--build"; fi
          ssh -o StrictHostKeyChecking=no ec2-user@"$EC2_IP" \
            "cd /app && sudo docker compose up -d --force-recreate $BUILD && echo '--- ps ---' && sudo docker compose ps"
