name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            이 PR을 한국어로 리뷰해 주세요. FastAPI 기반 ML 추론 서버(fitset-ml-server)입니다.
            먼저 `gh pr diff ${{ github.event.pull_request.number }}` 로 변경분을 확인하고,
            필요하면 Read/Grep으로 주변 코드를 살펴보세요. 변경된 코드만 집중해서 아래 관점으로 검토하세요.

            - 정확성 버그 및 엣지 케이스 (None/null 처리, 0으로 나누기, 예외 처리, 동시성)
            - FastAPI 라우팅·의존성·Pydantic 스키마 사용의 적절성
            - ML 추론 경로의 성능 (불필요한 모델 재로딩, 동기 블로킹, 메모리)
            - 보안 (시크릿/자격증명 노출, 입력 검증, 경로 조작)
            - 단순화·중복 제거 가능 지점

            발견한 문제는 `mcp__github_inline_comment__create_inline_comment` 도구로 해당 코드
            줄에 인라인 코멘트를 남기세요. 그리고 마지막에 `gh pr comment ${{ github.event.pull_request.number }} --body`
            로 PR 전체 요약 코멘트를 한국어로 남기세요. 사소한 스타일 지적은 생략하고, 실제로
            고칠 가치가 있는 항목 위주로. 특이사항이 없으면 요약에 "리뷰 결과 특이사항 없음"이라고 남기세요.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob"
            --max-turns 25
