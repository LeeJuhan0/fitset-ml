name: Deploy

on:
  push:
    branches: [main]

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    outputs:
      ec2_ip: ${{ steps.tf_output.outputs.ec2_ip }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get EC2 IP
        id: tf_output
        working-directory: terraform
        run: echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: terraform
    env:
      EC2_IP: ${{ needs.terraform.outputs.ec2_ip }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Wait for EC2 SSH ready
        run: |
          for i in $(seq 1 20); do
            ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no \
              ec2-user@$EC2_IP "echo ok" && break
            echo "Attempt $i failed, retrying..."
            sleep 15
          done

      - name: Ensure Docker + Compose installed
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@$EC2_IP << 'EOF'
          if ! command -v docker &>/dev/null; then
            sudo dnf install -y docker
            sudo systemctl enable --now docker
            sudo usermod -aG docker ec2-user
          fi
          if ! sudo docker compose version &>/dev/null 2>&1; then
            ARCH=$(uname -m)
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -fsSL "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-${ARCH}" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi
          # 기존 systemd 서비스 정리
          sudo systemctl stop fitset-api mlflow 2>/dev/null || true
          sudo systemctl disable fitset-api mlflow 2>/dev/null || true
          EOF

      - name: Rsync code to EC2
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='terraform' \
            --exclude='mlruns' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ec2-user@$EC2_IP:/app/

      - name: Build & start containers
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@$EC2_IP << 'EOF'
          cd /app
          sudo docker compose build --no-cache
          sudo docker compose up -d
          sudo docker compose ps
          EOF
