name: Deploy

on:
  push:
    branches: [main]

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    outputs:
      ec2_ip: ${{ steps.tf_output.outputs.ec2_ip }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get EC2 IP
        id: tf_output
        working-directory: terraform
        run: echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ needs.terraform.outputs.ec2_ip }} >> ~/.ssh/known_hosts

      - name: Wait for EC2 SSH ready
        run: |
          for i in $(seq 1 20); do
            ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no \
              ec2-user@${{ needs.terraform.outputs.ec2_ip }} "echo ok" && break
            echo "Attempt $i failed, retrying..."
            sleep 15
          done

      - name: Rsync code to EC2
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='terraform' \
            --exclude='mlruns' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ec2-user@${{ needs.terraform.outputs.ec2_ip }}:/app/

      - name: Install deps & restart services
        run: |
          ssh -o StrictHostKeyChecking=no \
            ec2-user@${{ needs.terraform.outputs.ec2_ip }} << 'EOF'
            mkdir -p /app/tmp
            TMPDIR=/app/tmp pip3.11 install -q -r /app/requirements.txt
            UVICORN=$(python3.11 -m site --user-base)/bin/uvicorn
            MLFLOW_BIN=$(python3.11 -m site --user-base)/bin/mlflow
            sudo sed -i "s|ExecStart=.*uvicorn|ExecStart=$UVICORN|" /etc/systemd/system/fitset-api.service
            sudo sed -i "s|ExecStart=.*mlflow|ExecStart=$MLFLOW_BIN|" /etc/systemd/system/mlflow.service
            sudo systemctl daemon-reload
            sudo systemctl restart mlflow fitset-api
            sudo systemctl is-active mlflow fitset-api
          EOF
