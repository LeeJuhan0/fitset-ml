name: Deploy

on:
  push:
    branches: [main]
    # 소스/인프라 변경 시에만 배포 — README·docs·.github(yaml)만 바뀌면 서버 재기동 안 함
    paths:
      - 'app/**'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'pytest.ini'
      - 'terraform/**'

# 배포는 직렬화하되 진행 중 배포는 죽이지 않는다(중간 중단 방지)
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # CD 게이트 — 테스트 통과해야 배포(terraform/deploy) 진행
  test:
    name: Test (CD gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (e2e 제외)
        run: pytest -m "not e2e"

  terraform:
    name: Terraform Apply
    needs: test
    runs-on: ubuntu-latest
    outputs:
      ec2_ip: ${{ steps.tf_output.outputs.ec2_ip }}
      ec2_dns: ${{ steps.tf_output.outputs.ec2_dns }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get EC2 IP/DNS
        id: tf_output
        working-directory: terraform
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "ec2_dns=$(terraform output -raw ec2_public_dns)" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: [test, terraform]
    env:
      EC2_IP: ${{ needs.terraform.outputs.ec2_ip }}
      EC2_DNS: ${{ needs.terraform.outputs.ec2_dns }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Wait for EC2 SSH ready
        run: |
          for i in $(seq 1 20); do
            ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no \
              ec2-user@$EC2_IP "echo ok" && break
            echo "Attempt $i failed, retrying..."
            sleep 15
          done

      - name: Ensure Docker + Compose installed
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@$EC2_IP << 'EOF'
          if ! command -v docker &>/dev/null; then
            sudo dnf install -y docker
            sudo systemctl enable --now docker
            sudo usermod -aG docker ec2-user
          fi
          if ! sudo docker compose version &>/dev/null 2>&1; then
            ARCH=$(uname -m)
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -fsSL "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-${ARCH}" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi
          # 기존 systemd 서비스 정리
          sudo systemctl stop fitset-api mlflow 2>/dev/null || true
          sudo systemctl disable fitset-api mlflow 2>/dev/null || true
          EOF

      - name: Rsync code to EC2
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='terraform' \
            --exclude='mlruns' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ec2-user@$EC2_IP:/app/

      - name: Inject MLflow allowed-hosts (현재 EIP/DNS)
        run: |
          # compose가 자동 로드하는 /app/.env에 현재 EIP·DNS를 주입.
          # rsync(--delete) 이후에 생성해야 살아남는다(이 step은 rsync 다음).
          ALLOWED="${EC2_IP}:5001,${EC2_DNS}:5001"
          ssh -o StrictHostKeyChecking=no ec2-user@$EC2_IP \
            "echo 'EC2_ALLOWED_HOST=${ALLOWED}' | sudo tee /app/.env >/dev/null"

      - name: Build & start containers
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@$EC2_IP << 'EOF'
          cd /app
          sudo docker compose build --no-cache
          # --force-recreate: 코드만 바뀌어도 컨테이너를 새 이미지로 반드시 재생성
          sudo docker compose up -d --force-recreate
          sudo docker compose ps
          EOF
