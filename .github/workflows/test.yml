name: Test

on:
  # PR 게이트 전용. main 푸시 시점의 테스트는 Deploy 워크플로의 CD 게이트(test job)가 담당.
  pull_request:

# 같은 ref에 새 push가 오면 이전 테스트 실행을 취소(중복 제거)
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 단위 + moto 통합 테스트 (빠른 게이트, AWS 자격증명 불필요)
  # E2E(tests/test_s3_e2e.py, -m e2e)는 실 S3가 필요해 CI에서 제외 — 필요 시 로컬에서 수동 실행.
  unit:
    name: Unit & Integration (moto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (e2e 제외)
        run: pytest -m "not e2e"
