name: Test

on:
  push:
  pull_request:

jobs:
  # 단위 + moto 통합 테스트 (빠른 게이트, AWS 자격증명 불필요)
  # E2E(tests/test_s3_e2e.py, -m e2e)는 실 S3가 필요해 CI에서 제외 — 필요 시 로컬에서 수동 실행.
  unit:
on:
  push:
    branches: [main]
  pull_request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (e2e 제외)
        run: pytest -m "not e2e"
