# 이미지 2종(admin-api·mlflow)을 빌드해 ECR 에 올리고, EKS 클러스터 fitset 의
# fitset-ml 네임스페이스에 kubectl apply -k 로 배포한다. 테스트 게이트는 PR 의 test.yml 이 담당한다(머지 = 통과 전제).
name: CD

on:
  push:
    branches: [develop]
    paths:
      - "app/**"
      - "mlflow/**"
      - "Dockerfile"
      - "deploy/k8s/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/cd.yml"
  workflow_dispatch: {}

concurrency:
  group: cd-fitset-ml-server
  cancel-in-progress: false

permissions:
  id-token: write # OIDC 로 AWS 역할 assume
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR: 729743892772.dkr.ecr.ap-northeast-2.amazonaws.com
  EKS_CLUSTER: fitset
  K8S_NAMESPACE: fitset-ml
  ML_HOST: ml-dev.fitset.kro.kr

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: fitset-ml-admin-api
            dockerfile: Dockerfile
          - name: fitset-mlflow
            dockerfile: mlflow/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # 장기 액세스 키를 쓰지 않는다. 만료 없는 자격증명을 GitHub 에 두지 않으려는 것이다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::729743892772:role/fitset-ml-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # mlflow 이미지는 스냅샷 DB 를 굽는다 — 빌드 자산이라 git 에 없고 S3 백업에서 받는다
      - name: Fetch mlflow snapshot db
        if: matrix.name == 'fitset-mlflow'
        run: aws s3 cp s3://fitset-models/backup/mlflow-20260824.db mlflow/mlflow.db

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # 태그는 커밋 SHA 만 단다. 움직이는 태그를 쓰면 박스에 떠 있는 이미지가
          # 어느 커밋인지 되짚을 수 없다.
          tags: ${{ env.ECR }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 빌드는 별도 잡(매트릭스 2개)이라 이 잡에서는 시작 시각을 알 수 없다.
      # 여기서 재는 것은 배포 구간뿐이고, 전체 시간은 Actions 의 실행 시간을 본다.
      - name: 소요 시간 측정 시작
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::729743892772:role/fitset-ml-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/checkout@v4

      - name: Deploy to EKS
        id: deploy
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

          # 레포의 매니페스트는 IMAGE_TAG 자리표시자로 두고, 배포할 때만 커밋 SHA 로 채운다.
          OVERLAY=deploy/k8s/overlays/dev
          sed -i "s/IMAGE_TAG/${{ github.sha }}/g" "$OVERLAY"/*.yaml
          kubectl apply -k "$OVERLAY"

      - name: Wait for rollout
        id: rollout
        # apply 가 일부만 적용되고 실패해도, 이미 바뀐 Deployment 의 상태와 로그는 남긴다.
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        run: |
          # 둘 다 Recreate 라 옛 파드가 먼저 내려가고 새 파드가 뜬다. mlflow 는 initContainer 에서 db upgrade 를 먼저 돈다.
          ok=true
          for d in fitset-mlflow fitset-ml-admin; do
            kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$d" --timeout=5m || ok=false
          done
          if [ "$ok" = true ]; then
            exit 0
          fi
          kubectl -n "$K8S_NAMESPACE" get pods -o wide || true
          kubectl -n "$K8S_NAMESPACE" logs -l app=fitset-mlflow --tail=50 --all-containers --prefix || true
          kubectl -n "$K8S_NAMESPACE" logs -l app=fitset-ml-admin --tail=100 --prefix || true
          kubectl -n "$K8S_NAMESPACE" get events --sort-by=.lastTimestamp | tail -20 || true
          # 자동 rollout undo 는 하지 않는다. 두 서버 모두 기동할 때 스키마를 앞으로만 올리므로(alembic·mlflow db upgrade),
          # 새 스키마가 이미 적용된 뒤 옛 이미지로 돌리면 옛 코드가 모르는 리비전을 만나 기동에 실패한다.
          echo "::error::롤아웃 실패. 스키마가 바뀌었는지 확인한 뒤 수동으로 되돌린다: kubectl -n $K8S_NAMESPACE rollout undo deployment/<이름>"
          exit 1

      - name: Verify through ALB
        run: |
          # 이 서비스는 대시보드·API 가 전부 Basic 인증 뒤에 있고 /api/health 만 공개다.
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$ML_HOST/api/health" || echo 000)
            echo "시도 $i: $CODE"
            case "$CODE" in
              000|5*) sleep 10 ;;
              *) echo "ALB 를 통해 응답을 받았다 ($CODE)"; exit 0 ;;
            esac
          done
          echo "::error::ALB 를 통한 확인에 실패했다. $ML_HOST 의 DNS 레코드가 등록됐는지 본다."
          exit 1

      - name: 핏봇 배포 결과 알림
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          START_TS: ${{ steps.timer.outputs.start }}
          BUILT_TS: ${{ steps.timer-build.outputs.built }}
          SERVICE: ml-admin-api
          TARGET_URL: https://ml-dev.fitset.kro.kr
          FAILED_STEP: ${{ steps.deploy.outcome == 'failure' && 'EKS 배포' || steps.rollout.outcome == 'failure' && '롤아웃(수동 확인 필요)' || '배포 검증' }}
        run: |
          # 웹훅이 없는 레포에서 배포 자체를 실패로 만들지 않는다.
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 알림 생략"
            exit 0
          fi

          fmt() {  # 초 → "8분 11초"
            if [ "$1" -lt 60 ]; then printf '%d초' "$1"; else printf '%d분 %d초' $(( $1 / 60 )) $(( $1 % 60 )); fi
          }
          NOW=$(date +%s)
          START=${START_TS:-$NOW}
          TOTAL=$(fmt $(( NOW - START )))

          # 빌드 전에 깨지면 단계별 내역 자체가 없다.
          BREAKDOWN=""
          if [ -n "$BUILT_TS" ]; then
            BREAKDOWN="이미지 빌드 $(fmt $(( BUILT_TS - START )))"
            if [ "$NOW" -gt "$BUILT_TS" ]; then
              BREAKDOWN="$BREAKDOWN  ·  배포 $(fmt $(( NOW - BUILT_TS )))"
            fi
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI=":rocket:"; HEADLINE="배포 성공"; COLOR="#2eb886"; STAGE=""
          else
            EMOJI=":rotating_light:"; HEADLINE="배포 실패"; COLOR="#d73a4a"; STAGE="$FAILED_STEP"
          fi

          jq -n \
            --arg emoji "$EMOJI" --arg headline "$HEADLINE" --arg color "$COLOR" \
            --arg service "$SERVICE" --arg subject "커밋 열기" \
            --arg sha "${GITHUB_SHA:0:7}" \
            --arg shaurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg actor "$GITHUB_ACTOR" --arg total "$TOTAL" --arg breakdown "$BREAKDOWN" \
            --arg target "$TARGET_URL" --arg branch "$GITHUB_REF_NAME" \
            --arg run "$GITHUB_RUN_NUMBER" --arg stage "$STAGE" \
            '
            def field($label; $value): { type: "mrkdwn", text: ("*" + $label + "*\n" + $value) };
            {
              text: ($headline + " — " + $service + " " + $sha + " (" + $total + ")"),
              attachments: [{
                color: $color,
                blocks: [
                  { type: "header",
                    text: { type: "plain_text", text: ($emoji + " " + $headline + " · " + $service), emoji: true } },
                  { type: "section",
                    text: { type: "mrkdwn", text: ("<" + $shaurl + "|`" + $sha + "`>  " + $subject) } },
                  { type: "section",
                    fields: ( [ field("소요 시간"; $total), field("이미지 태그"; $sha) ]
                              + (if $breakdown == "" then [] else [ field("단계별"; $breakdown) ] end)
                              + (if $stage == "" then [ field("주소"; $target) ] else [ field("실패 단계"; $stage) ] end)
                              + [ field("배포자"; $actor) ] ) },
                  { type: "actions",
                    elements: [ { type: "button",
                                  text: { type: "plain_text", text: "실행 로그 보기" },
                                  url: $runurl } ] },
                  { type: "context",
                    elements: [ { type: "mrkdwn", text: ("`" + $branch + "` 브랜치  ·  실행 #" + $run) } ] }
                ]
              }]
            }' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"
