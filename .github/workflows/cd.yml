# 이미지 2종(admin-api·mlflow)을 빌드해 ECR 에 올리고, SSM 으로 dev 인스턴스의
# 컨테이너를 교체한다. 테스트 게이트는 PR 의 test.yml 이 담당한다(머지 = 통과 전제).
name: CD

on:
  push:
    branches: [develop]
    paths:
      - "libs/**"
      - "services/**"
      - "requirements/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch: {}

concurrency:
  group: cd-fitset-ml-server
  cancel-in-progress: false

permissions:
  id-token: write # OIDC 로 AWS 역할 assume
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR: 729743892772.dkr.ecr.ap-northeast-2.amazonaws.com
  INSTANCE_ID: i-07cafd4e3b9ddaf71
  ML_HOST: ml-dev.fitset.kro.kr

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: fitset-ml-admin-api
            dockerfile: services/admin_api/Dockerfile
          - name: fitset-mlflow
            dockerfile: services/mlflow/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # 장기 액세스 키를 쓰지 않는다. 만료 없는 자격증명을 GitHub 에 두지 않으려는 것이다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::729743892772:role/fitset-ml-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # mlflow 이미지는 스냅샷 DB 를 굽는다 — 빌드 자산이라 git 에 없고 S3 백업에서 받는다
      - name: Fetch mlflow snapshot db
        if: matrix.name == 'fitset-mlflow'
        run: aws s3 cp s3://fitset-models/backup/mlflow-20260824.db services/mlflow/mlflow.db

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # 태그는 커밋 SHA 만 단다. 움직이는 태그를 쓰면 박스에 떠 있는 이미지가
          # 어느 커밋인지 되짚을 수 없다.
          tags: ${{ env.ECR }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::729743892772:role/fitset-ml-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        id: send
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters '{"commands":[
              "set -e",
              "aws s3 sync s3://fitset-deploy-artifacts/dev/ml-compose/ /opt/fitset/ --delete",
              "chmod +x /opt/fitset/up.sh",
              "echo ${{ github.sha }} > /opt/fitset/image",
              "/opt/fitset/up.sh",
              "for i in $(seq 1 60); do curl -fsS localhost:8000/api/health >/dev/null && exit 0; sleep 5; done",
              "echo 헬스체크가 5분을 넘겼다. 컨테이너 로그를 남긴다.",
              "docker logs --tail 100 fitset-ml-admin 2>&1 || true",
              "docker logs --tail 50 fitset-mlflow 2>&1 || true",
              "exit 1"
            ]}' \
            --query Command.CommandId --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          CID="${{ steps.send.outputs.command_id }}"
          for i in $(seq 1 100); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output json \
            | python3 -c 'import sys, json; d = json.load(sys.stdin); print(d["Status"]); print(d["Out"]); print(d["Err"], file=sys.stderr); sys.exit(0 if d["Status"] == "Success" else 1)'

      - name: Verify through ALB
        run: |
          # 이 서비스는 대시보드·API 가 전부 Basic 인증 뒤에 있고 /api/health 만 공개다.
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$ML_HOST/api/health" || echo 000)
            echo "시도 $i: $CODE"
            case "$CODE" in
              000|5*) sleep 10 ;;
              *) echo "ALB 를 통해 응답을 받았다 ($CODE)"; exit 0 ;;
            esac
          done
          echo "::error::ALB 를 통한 확인에 실패했다. $ML_HOST 의 DNS 레코드가 등록됐는지 본다."
          exit 1
