name: Terraform

# 인프라는 자동 적용하지 않는다.
# - PR에서 terraform/** 가 바뀌면 'plan'만 돌려 변경 내용을 미리 검토
# - 실제 'apply'는 수동(workflow_dispatch)으로만 — 네트워크/EC2 등 blast radius가 커서 의도적으로만 적용
on:
  pull_request:
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: "실행할 terraform 동작"
        type: choice
        options: [plan, apply]
        default: plan

concurrency:
  group: terraform-main
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform (${{ github.event_name == 'workflow_dispatch' && inputs.action || 'plan' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Terraform Init
        run: terraform init

      # PR이든 수동이든 항상 plan으로 변경 내용을 먼저 보여준다
      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      # apply는 오직 수동 실행 + action=apply 일 때만
      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -auto-approve
