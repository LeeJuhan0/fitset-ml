name: Claude Assistant

on:
  # 리뷰 봇이 다는 review/inline-comment 이벤트는 트리거에서 제외 → 캐스케이드 실행 자체가
  # Actions에 안 뜸. @claude는 일반 코멘트(PR 코멘트 포함)·이슈에서 호출.
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

# 어시스턴트는 직렬화만(진행 중 작업은 죽이지 않음)
concurrency:
  group: claude-assistant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claude:
    # 봇이 만든 이벤트(리뷰 봇 코멘트 등)에는 반응하지 않음 → 봇 캐스케이드 차단.
    # 그 위에서 @claude 멘션이 포함된 코멘트/이슈에만 동작.
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
